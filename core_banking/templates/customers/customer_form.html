{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">ثبت مشتری جدید</h5>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">نام</label>
                        <input type="text" name="first_name" class="form-control"
                               value="{{ form_data.first_name|default:'' }}" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">نام خانوادگی</label>
                        <input type="text" name="last_name" class="form-control"
                               value="{{ form_data.last_name|default:'' }}" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">کد ملی</label>
                        <input type="text" name="national_id" class="form-control"
                               value="{{ form_data.national_id|default:'' }}" maxlength="10" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">شماره تماس</label>
                        <input type="text" name="phone_number" class="form-control"
                               value="{{ form_data.phone_number|default:'' }}" maxlength="11" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">ایمیل</label>
                        <input type="email" name="email" class="form-control"
                               value="{{ form_data.email|default:'' }}">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">شهر</label>
                        <select name="fk_customer_city" class="form-select" required>
                            <option value="">-- انتخاب شهر --</option>
                            {% for city in cities %}
                                <option value="{{ city.city_id }}"
                                    {% if form_data.fk_customer_city == city.city_id|stringformat:"s" %}selected{% endif %}>
                                    {{ city.city_name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-12 mb-3">
                        <label class="form-label">آدرس</label>
                        <textarea name="address" class="form-control" rows="3" required>{{ form_data.address|default:'' }}</textarea>
                    </div>
                </div>

                <button type="submit" class="btn btn-success">ثبت مشتری</button>
                <a href="{% url 'customer_list' %}" class="btn btn-secondary">مشاهده لیست</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
