{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    {% if form_mode == 'create' %}
        <h2>ایجاد کاربر بانکی</h2>
    {% else %}
        <h2>ویرایش کاربر بانکی</h2>
    {% endif %}

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}success{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">نام کاربری</label>
            <input
                type="text"
                name="username"
                class="form-control"
                value="{{ user_data.username|default:'' }}"
                required
            >
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">نام</label>
                <input
                    type="text"
                    name="first_name"
                    class="form-control"
                    value="{{ user_data.first_name|default:'' }}"
                    required
                >
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">نام خانوادگی</label>
                <input
                    type="text"
                    name="last_name"
                    class="form-control"
                    value="{{ user_data.last_name|default:'' }}"
                    required
                >
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">کد ملی</label>
            <input
                type="text"
                name="national_id"
                class="form-control"
                value="{{ user_data.national_id|default:'' }}"
                maxlength="10"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">نقش / سطح دسترسی</label>
            <select name="fk_user_role" class="form-select" required>
                <option value="">انتخاب نقش</option>
                {% for role in roles %}
                    <option value="{{ role.role_id }}"
                        {% if user_data.fk_user_role == role.role_id %}selected{% endif %}>
                        {{ role.role_name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">وضعیت</label>
            <select name="is_active" class="form-select">
                <option value="1" {% if user_data.is_active %}selected{% endif %}>فعال</option>
                <option value="0" {% if user_data.is_active == 0 %}selected{% endif %}>غیرفعال</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">ذخیره</button>
        <a href="{% url 'organization:bank_user_list' %}" class="btn btn-secondary">بازگشت</a>
    </form>
</div>
{% endblock %}
